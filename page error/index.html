<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fef3e2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-family:'Nunito',sans-serif}

/* Sky */
body::before{content:'';position:fixed;inset:0;background:linear-gradient(180deg,#bfdbfe 0%,#fef3e2 55%);z-index:0}

/* Ground */
.ground{position:fixed;bottom:0;left:0;right:0;height:100px;z-index:1;
  background:linear-gradient(to bottom,#86efac,#4ade80);
  border-radius:50% 50% 0 0/18px 18px 0 0;
  border-top:3px solid #16a34a}

/* Clouds */
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(120vw)}}

/* Card */
.card{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:16px;padding-bottom:80px}

/* 404 */
.num{font-size:clamp(5rem,14vw,10rem);font-weight:900;color:#1e3a5f;letter-spacing:-.04em;line-height:1;
  text-shadow:5px 7px 0 rgba(30,58,95,.12);
  animation:num-bob 2.8s ease-in-out infinite}
@keyframes num-bob{0%,100%{transform:rotate(-1deg) translateY(0)}50%{transform:rotate(1deg) translateY(-5px)}}

/* ── SCENE STRIP ── */
.scene-strip{width:min(640px,95vw);height:180px;position:relative;overflow:hidden;border-radius:16px;background:rgba(255,255,255,.35);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.5)}

/* ── Ground line in strip ── */
.strip-ground{position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(to bottom,#86efac,#4ade80);border-top:2px solid #16a34a}

/* ── FOOD BOWL (fish) ── */
.bowl{position:absolute;left:80px;bottom:38px;animation:bowl-shake 10s ease-in-out infinite}
@keyframes bowl-shake{0%,52%,100%{transform:translateX(0) rotate(0)}54%{transform:translateX(-6px) rotate(-8deg)}56%{transform:translateX(4px) rotate(6deg)}58%{transform:translateX(-8px) rotate(-10deg) translateY(-15px)}62%,100%{transform:translateX(-800px) rotate(-20deg)}}

/* ── CAT ── */
.cat{position:absolute;left:60px;bottom:38px;animation:cat-action 10s ease-in-out infinite;transform-origin:50% 100%}
@keyframes cat-action{
  /* 0-50%: peaceful eating */
  0%{transform:translateX(0) scaleX(1)}
  /* 50%: dog enters → cat STARTLES */
  50%{transform:translateX(0) scaleX(1)}
  52%{transform:translateX(0) scaleY(1.25) scaleX(.8)} /* squash up in fear */
  54%{transform:translateX(0) scaleY(.85) scaleX(1.1)} /* squash down */
  /* 55% onwards: run left (cat faces left = scaleX(-1)) */
  55%{transform:translateX(0) scaleX(-1)}
  80%{transform:translateX(-650px) scaleX(-1)}
  82%,100%{transform:translateX(-650px) scaleX(-1)}
}

/* Cat body bob while eating */
.cat-eat-bob{animation:eat-bob 0.5s ease-in-out infinite}
@keyframes eat-bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(2deg)}}

/* Cat tail swish */
.cat-tail{transform-origin:10px 5px;animation:tail-swish 1.1s ease-in-out infinite}
@keyframes tail-swish{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}}

/* Cat running legs (cycle during run phase) */
.cat-leg-f{transform-origin:10px 0;animation:run-leg-f 10s ease-in-out infinite}
.cat-leg-b{transform-origin:10px 0;animation:run-leg-b 10s ease-in-out infinite}
@keyframes run-leg-f{
  0%,53%{transform:rotate(0)}
  55%,79%{animation-timing-function:linear}
  /* quick alternating rotations during run */
  55%{transform:rotate(30deg)}57%{transform:rotate(-30deg)}59%{transform:rotate(30deg)}61%{transform:rotate(-30deg)}
  63%{transform:rotate(30deg)}65%{transform:rotate(-30deg)}67%{transform:rotate(30deg)}69%{transform:rotate(-30deg)}
  71%{transform:rotate(30deg)}73%{transform:rotate(-30deg)}75%{transform:rotate(30deg)}77%{transform:rotate(-30deg)}
  79%,100%{transform:rotate(0)}
}
@keyframes run-leg-b{
  0%,53%{transform:rotate(0)}
  55%{transform:rotate(-30deg)}57%{transform:rotate(30deg)}59%{transform:rotate(-30deg)}61%{transform:rotate(30deg)}
  63%{transform:rotate(-30deg)}65%{transform:rotate(30deg)}67%{transform:rotate(-30deg)}69%{transform:rotate(30deg)}
  71%{transform:rotate(-30deg)}73%{transform:rotate(30deg)}75%{transform:rotate(-30deg)}77%{transform:rotate(30deg)}
  79%,100%{transform:rotate(0)}
}

/* Cat eye (blinking while eating) */
.cat-eye{animation:cat-blink 3.5s ease-in-out infinite;transform-origin:50% 0}
@keyframes cat-blink{0%,88%,100%{transform:scaleY(1)}91%,95%{transform:scaleY(.1)}}

/* ── DOG ── */
.dog{position:absolute;right:-160px;bottom:38px;animation:dog-run 10s ease-in-out infinite;transform-origin:50% 100%}
@keyframes dog-run{
  /* 0-48%: waiting off-screen right */
  0%,48%{transform:translateX(0) scaleX(1)}
  /* 48-55%: zoom in from right  */
  50%{transform:translateX(-40px) scaleX(1)}  /* slight anticipation rattle */
  55%{transform:translateX(-530px) scaleX(1)} /* arrive at cat position */
  /* skid: overshoot + come back */
  57%{transform:translateX(-560px) scaleX(1)}
  59%{transform:translateX(-540px) scaleX(1)}
  /* 60-80% chase the cat leftward */
  61%{transform:translateX(-540px) scaleX(-1)} /* now facing left */
  82%{transform:translateX(-1200px) scaleX(-1)}
  83%,100%{transform:translateX(-1200px) scaleX(-1)}
}

/* Dog tongue wag */
.dog-tongue{transform-origin:6px 0;animation:tongue-wag 0.35s ease-in-out infinite}
@keyframes tongue-wag{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}

/* Dog tail wag */
.dog-tail{transform-origin:0 10px;animation:dog-tail-wag .25s ease-in-out infinite}
@keyframes dog-tail-wag{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}}

/* Dog running legs */
.dog-leg-f{transform-origin:8px 0;animation:dog-leg-cycle 10s linear infinite}
.dog-leg-b{transform-origin:8px 0;animation:dog-leg-cycle2 10s linear infinite}
@keyframes dog-leg-cycle{
  0%,48%{transform:rotate(0)}
  49%,82%{animation-timing-function:linear}
  49%{transform:rotate(35deg)}51%{transform:rotate(-35deg)}53%{transform:rotate(35deg)}55%{transform:rotate(-35deg)}
  57%{transform:rotate(35deg)}59%{transform:rotate(-35deg)}61%{transform:rotate(35deg)}63%{transform:rotate(-35deg)}
  65%{transform:rotate(35deg)}67%{transform:rotate(-35deg)}69%{transform:rotate(35deg)}71%{transform:rotate(-35deg)}
  73%{transform:rotate(35deg)}75%{transform:rotate(-35deg)}77%{transform:rotate(35deg)}79%{transform:rotate(-35deg)}
  81%,100%{transform:rotate(0)}
}
@keyframes dog-leg-cycle2{
  0%,48%{transform:rotate(0)}
  49%{transform:rotate(-35deg)}51%{transform:rotate(35deg)}53%{transform:rotate(-35deg)}55%{transform:rotate(35deg)}
  57%{transform:rotate(-35deg)}59%{transform:rotate(35deg)}61%{transform:rotate(-35deg)}63%{transform:rotate(35deg)}
  65%{transform:rotate(-35deg)}67%{transform:rotate(35deg)}69%{transform:rotate(-35deg)}71%{transform:rotate(35deg)}
  73%{transform:rotate(-35deg)}75%{transform:rotate(35deg)}77%{transform:rotate(-35deg)}79%{transform:rotate(35deg)}
  81%,100%{transform:rotate(0)}
}

/* ── Dust puffs appear when chase starts ── */
.dust-wrap{position:absolute;bottom:38px;left:100px;animation:dust-appear 10s infinite}
@keyframes dust-appear{0%,53%,82%,100%{opacity:0}54%,80%{opacity:1}}
@keyframes puff{0%{transform:scale(.2) translate(0,0);opacity:.7}100%{transform:scale(2.5) translate(-20px,-30px);opacity:0}}
.puff1{animation:puff .6s ease-out 0s infinite}
.puff2{animation:puff .6s ease-out .2s infinite}
.puff3{animation:puff .6s ease-out .4s infinite}

/* ── Fish drops when cat runs ── */
.fish{position:absolute;left:96px;bottom:38px;font-size:24px;animation:fish-drop 10s infinite}
@keyframes fish-drop{0%,53%{transform:translateY(0) rotate(0);opacity:0}
54%{opacity:1;transform:translateY(0) rotate(0)}
62%{transform:translateY(20px) rotate(45deg);opacity:1}
70%,100%{transform:translateY(20px) rotate(60deg);opacity:.6}}

/* Motion lines */
.motion-lines{position:absolute;right:160px;bottom:60px;opacity:0;animation:lines-show 10s infinite}
@keyframes lines-show{0%,49%,82%,100%{opacity:0}50%,80%{opacity:1}}

/* Text */
.headline{font-size:1.5rem;font-weight:900;color:#1e3a5f;text-align:center}
.sub{font-size:.95rem;color:#64748b;text-align:center;max-width:340px;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 30px;border-radius:999px;background:#1e3a5f;color:#fff;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;text-decoration:none;box-shadow:0 6px 0 #0f1f33;transition:transform .12s,box-shadow .12s;margin-top:4px}
.btn:hover{transform:translateY(-3px);box-shadow:0 9px 0 #0f1f33}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0f1f33}

/* Clouds */
.cloud{position:fixed;z-index:0;border-radius:50%;background:white;opacity:.65;animation:drift linear infinite}
</style>
</head>
<body>

<!-- Clouds -->
<div class="cloud" style="top:6%;width:110px;height:30px;animation-duration:30s;animation-delay:-8s">
  <div style="position:absolute;top:-20px;left:16px;width:48px;height:48px;background:white;border-radius:50%"></div>
  <div style="position:absolute;top:-12px;left:52px;width:34px;height:34px;background:white;border-radius:50%"></div>
</div>
<div class="cloud" style="top:13%;width:80px;height:22px;animation-duration:38s;animation-delay:-18s">
  <div style="position:absolute;top:-14px;left:14px;width:36px;height:36px;background:white;border-radius:50%"></div>
</div>

<div class="ground"></div>

<div class="card">
  <div class="num">404</div>

  <!-- ANIMATION STRIP -->
  <div class="scene-strip">
    <div class="strip-ground"></div>

    <!-- Dropped fish emoji -->
    <div class="fish">🐟</div>

    <!-- Dust puffs -->
    <div class="dust-wrap">
      <svg width="60" height="50" viewBox="0 0 60 50">
        <circle class="puff1" cx="15" cy="30" r="12" fill="#d4c4a0" opacity=".7"/>
        <circle class="puff2" cx="30" cy="25" r="9" fill="#c8b896" opacity=".6"/>
        <circle class="puff3" cx="45" cy="28" r="7" fill="#ddd0b0" opacity=".5"/>
      </svg>
    </div>

    <!-- Motion lines (speed lines when dog enters) -->
    <div class="motion-lines">
      <svg width="80" height="40" viewBox="0 0 80 40">
        <line x1="80" y1="8"  x2="0" y2="8"  stroke="#aaa" stroke-width="2" stroke-linecap="round" opacity=".6"/>
        <line x1="80" y1="16" x2="10" y2="16" stroke="#aaa" stroke-width="3" stroke-linecap="round" opacity=".8"/>
        <line x1="80" y1="24" x2="0" y2="24" stroke="#aaa" stroke-width="2" stroke-linecap="round" opacity=".6"/>
        <line x1="80" y1="32" x2="15" y2="32" stroke="#aaa" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
      </svg>
    </div>

    <!-- ── CAT SVG ── -->
    <svg class="cat" width="90" height="120" viewBox="0 0 90 120">
      <g class="cat-eat-bob">
        <!-- Tail -->
        <g class="cat-tail" style="transform-origin:8px 95px">
          <path d="M8,95 Q-15,75 -10,55 Q-6,40 5,45" stroke="#e07030" stroke-width="7" fill="none" stroke-linecap="round"/>
        </g>
        <!-- Body -->
        <ellipse cx="45" cy="90" rx="32" ry="25" fill="#f97316"/>
        <!-- Belly -->
        <ellipse cx="48" cy="95" rx="18" ry="14" fill="#fde68a"/>
        <!-- Head -->
        <circle cx="45" cy="52" r="30" fill="#f97316"/>
        <!-- Left ear -->
        <polygon points="18,35 10,8 32,28" fill="#f97316"/>
        <polygon points="21,32 16,14 30,26" fill="#fca5a5"/>
        <!-- Right ear -->
        <polygon points="72,35 80,8 58,28" fill="#f97316"/>
        <polygon points="69,32 74,14 60,26" fill="#fca5a5"/>
        <!-- Eyes -->
        <ellipse cx="35" cy="50" rx="9" ry="10" fill="white"/>
        <ellipse cx="35" cy="52" rx="6" ry="7" fill="#16a34a"/>
        <ellipse cx="35" cy="53" rx="3" ry="5" fill="#0f172a"/>
        <ellipse cx="33" cy="49" rx="2" ry="2" fill="white"/>
        <ellipse class="cat-eye" cx="35" cy="47" rx="9" ry="10" fill="#f97316"/>

        <ellipse cx="55" cy="50" rx="9" ry="10" fill="white"/>
        <ellipse cx="55" cy="52" rx="6" ry="7" fill="#16a34a"/>
        <ellipse cx="55" cy="53" rx="3" ry="5" fill="#0f172a"/>
        <ellipse cx="53" cy="49" rx="2" ry="2" fill="white"/>
        <ellipse class="cat-eye" cx="55" cy="47" rx="9" ry="10" fill="#f97316"/>
        <!-- Nose -->
        <polygon points="45,61 42,66 48,66" fill="#c2410c"/>
        <!-- Whiskers left -->
        <line x1="45" y1="64" x2="14" y2="60" stroke="#7c3f00" stroke-width="1.5" opacity=".7"/>
        <line x1="45" y1="66" x2="14" y2="68" stroke="#7c3f00" stroke-width="1.5" opacity=".7"/>
        <!-- Whiskers right -->
        <line x1="45" y1="64" x2="76" y2="60" stroke="#7c3f00" stroke-width="1.5" opacity=".7"/>
        <line x1="45" y1="66" x2="76" y2="68" stroke="#7c3f00" stroke-width="1.5" opacity=".7"/>
        <!-- Stripes -->
        <path d="M28,38 Q30,32 34,30" stroke="#ea6910" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M62,38 Q60,32 56,30" stroke="#ea6910" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- Legs front -->
        <rect class="cat-leg-f" x="28" y="112" width="14" height="14" rx="7" fill="#f97316" style="transform-origin:35px 112px"/>
        <rect class="cat-leg-b" x="48" y="112" width="14" height="14" rx="7" fill="#f97316" style="transform-origin:55px 112px"/>
        <!-- Paws -->
        <ellipse cx="35" cy="118" rx="9" ry="6" fill="#f97316"/>
        <ellipse cx="55" cy="118" rx="9" ry="6" fill="#f97316"/>
      </g>
    </svg>

    <!-- ── DOG SVG ── -->
    <svg class="dog" width="110" height="120" viewBox="0 0 110 120">
      <!-- Tail -->
      <g class="dog-tail" style="transform-origin:5px 60px">
        <path d="M5,60 Q-12,40 -5,22 Q0,10 10,15" stroke="#b45309" stroke-width="8" fill="none" stroke-linecap="round"/>
      </g>
      <!-- Body -->
      <ellipse cx="52" cy="88" rx="38" ry="26" fill="#d97706"/>
      <!-- Chest lighter patch -->
      <ellipse cx="56" cy="92" rx="20" ry="16" fill="#fde68a"/>
      <!-- Head -->
      <circle cx="52" cy="48" r="32" fill="#d97706"/>
      <!-- Floppy ears -->
      <ellipse cx="22" cy="60" rx="14" ry="20" fill="#b45309" transform="rotate(15,22,60)"/>
      <ellipse cx="82" cy="60" rx="14" ry="20" fill="#b45309" transform="rotate(-15,82,60)"/>
      <!-- Eyes (excited big) -->
      <ellipse cx="40" cy="44" rx="9" ry="10" fill="white"/>
      <ellipse cx="40" cy="46" rx="6" ry="7" fill="#1e0f3a"/>
      <ellipse cx="38" cy="42" rx="2.5" ry="2.5" fill="white"/>
      <ellipse cx="64" cy="44" rx="9" ry="10" fill="white"/>
      <ellipse cx="64" cy="46" rx="6" ry="7" fill="#1e0f3a"/>
      <ellipse cx="62" cy="42" rx="2.5" ry="2.5" fill="white"/>
      <!-- Big nose -->
      <ellipse cx="52" cy="60" rx="12" ry="9" fill="#1e0f3a"/>
      <ellipse cx="49" cy="58" rx="3" ry="2" fill="rgba(255,255,255,.3)"/>
      <!-- Tongue -->
      <g class="dog-tongue" style="transform-origin:52px 68px">
        <path d="M44,68 Q52,80 60,68" fill="#f43f5e" stroke="#e11d48" stroke-width="1.5"/>
      </g>
      <!-- Legs -->
      <rect class="dog-leg-f" x="30" y="110" width="16" height="16" rx="8" fill="#d97706" style="transform-origin:38px 110px"/>
      <rect class="dog-leg-b" x="56" y="110" width="16" height="16" rx="8" fill="#d97706" style="transform-origin:64px 110px"/>
      <ellipse cx="38" cy="118" rx="11" ry="7" fill="#b45309"/>
      <ellipse cx="64" cy="118" rx="11" ry="7" fill="#b45309"/>
    </svg>

    <!-- ── FOOD BOWL ── -->
    <svg class="bowl" width="60" height="50" viewBox="0 0 60 50">
      <ellipse cx="30" cy="40" rx="28" ry="10" fill="#6b7280"/>
      <path d="M2,30 Q30,50 58,30 L52,44 Q30,56 8,44Z" fill="#9ca3af"/>
      <ellipse cx="30" cy="30" rx="28" ry="10" fill="#d1d5db"/>
      <!-- Fish in bowl -->
      <text x="12" y="32" font-size="18">🐟</text>
    </svg>

  </div><!-- /scene-strip -->

  <h1 class="headline">The page ran away! 😱</h1>
  <p class="sub">A dog chased it off. It was last seen running at full speed somewhere over the horizon.</p>
  <a href="javascript:history.back()" class="btn">← Take me back</a>
</div>

<script>
// Paw prints on ground
for(let i=0;i<5;i++){
  const p=document.createElement('div');
  p.style.cssText=`position:fixed;bottom:${20+Math.random()*60}px;left:${8+i*18}%;font-size:${14+Math.random()*8}px;opacity:.25;z-index:2;transform:rotate(${Math.random()*30-15}deg)`;
  p.textContent='🐾';document.body.appendChild(p);
}
</script>
</body>
</html>
