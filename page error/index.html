<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root { --accent: #6366f1; --accent2: #e879f9; }

    body {
      font-family: 'Inter', sans-serif;
      background: #080810;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Grid background ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* ── Glowing orbs ── */
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); pointer-events: none; opacity: 0.25;
    }
    .orb-1 { width:380px; height:380px; background:#6366f1; top:-80px; left:-80px; }
    .orb-2 { width:300px; height:300px; background:#e879f9; bottom:-60px; right:-60px; }

    /* ── Main card ── */
    .card {
      position: relative; z-index: 10;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; gap: 20px;
      padding: 0 24px;
    }

    /* ── 404 glitch text ── */
    @keyframes glitch-1 {
      0%,100% { clip-path: inset(0 0 90% 0); transform: translate(-3px,0); }
      20%      { clip-path: inset(30% 0 50% 0); transform: translate(3px,0); }
      40%      { clip-path: inset(60% 0 20% 0); transform: translate(-2px,0); }
    }
    @keyframes glitch-2 {
      0%,100% { clip-path: inset(80% 0 5% 0); transform: translate(3px,0); }
      30%      { clip-path: inset(10% 0 70% 0); transform: translate(-3px,0); }
      60%      { clip-path: inset(50% 0 30% 0); transform: translate(2px,0); }
    }
    .glitch-wrap { position: relative; line-height: 1; }

    .glitch-main {
      font-size: clamp(7rem, 20vw, 13rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #fff 30%, #6366f1 70%, #e879f9);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      position: relative;
    }
    .glitch-main::before,
    .glitch-main::after {
      content: '404';
      position: absolute; top: 0; left: 0; right: 0;
      font-size: inherit; font-weight: inherit; letter-spacing: inherit;
    }
    .glitch-main::before {
      -webkit-text-fill-color: #6366f1;
      opacity: 0.6;
      animation: glitch-1 3.5s infinite;
    }
    .glitch-main::after {
      -webkit-text-fill-color: #e879f9;
      opacity: 0.5;
      animation: glitch-2 3.5s infinite 0.4s;
    }

    /* ── Scanline bar ── */
    @keyframes scan {
      0%   { top: -4px; }
      100% { top: 100%; }
    }
    .scanline {
      position: absolute; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, rgba(99,102,241,0.5), transparent);
      pointer-events: none;
      animation: scan 2.8s linear infinite;
    }

    /* ── Text ── */
    .tag {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--accent);
      border: 1px solid rgba(99,102,241,0.3);
      padding: 4px 12px; border-radius: 999px;
      background: rgba(99,102,241,0.08);
    }
    .headline { font-size: 1.3rem; font-weight: 700; color: #e2e2f0; }
    .sub {
      font-size: 0.9rem; font-weight: 300; color: #555; max-width: 320px; line-height: 1.6;
    }

    /* ── Back button ── */
    .btn {
      margin-top: 8px;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff; font-size: 0.88rem; font-weight: 600;
      text-decoration: none; border: none; cursor: pointer;
      box-shadow: 0 0 28px rgba(99,102,241,0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 40px rgba(99,102,241,0.55);
    }
    .btn svg { width: 16px; height: 16px; }

    /* ── Floating particles ── */
    @keyframes drift {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.2; }
      100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
    }
    .particle {
      position: fixed; pointer-events: none;
      animation: drift linear infinite;
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <span class="tag">Error 404</span>

    <div class="glitch-wrap">
      <div class="glitch-main">404</div>
      <div class="scanline"></div>
    </div>

    <h1 class="headline">Page not found</h1>
    <p class="sub">The page you're looking for doesn't exist or has been moved to another universe.</p>

    <a href="javascript:history.back()" class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      Go back
    </a>
  </div>

<script>
  // Floating geometric particles
  const shapes = ['◆','▲','●','◉','✦','⬡'];
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const colors = ['#6366f1','#e879f9','#38bdf8','#a855f7'];
    p.style.cssText = `
      left: ${Math.random()*100}vw;
      bottom: -20px;
      font-size: ${Math.random()*10+6}px;
      color: ${colors[Math.floor(Math.random()*colors.length)]};
      opacity: 0;
      animation-duration: ${Math.random()*10+8}s;
      animation-delay: ${Math.random()*8}s;
    `;
    p.textContent = shapes[Math.floor(Math.random()*shapes.length)];
    document.body.appendChild(p);
  }
</script>
</body>
</html>
