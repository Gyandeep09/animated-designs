<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Oops!</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #fef9f0;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* ── Sky gradient ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: linear-gradient(180deg, #e0f2fe 0%, #fef9f0 60%);
      z-index: 0;
    }

    /* ── Clouds ── */
    .cloud {
      position: fixed; z-index: 1;
      background: white;
      border-radius: 999px;
      opacity: 0.7;
      animation: cloud-drift linear infinite;
    }
    .cloud::before, .cloud::after {
      content: ''; position: absolute;
      background: white; border-radius: 50%;
    }
    @keyframes cloud-drift {
      from { transform: translateX(-20vw); }
      to   { transform: translateX(120vw); }
    }

    /* ── Ground ── */
    .ground {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 90px; z-index: 2;
      background: linear-gradient(to bottom, #86efac, #4ade80);
      border-top: 4px solid #16a34a;
      border-radius: 100% 100% 0 0 / 20px 20px 0 0;
    }
    .ground::before {
      content: '';
      position: absolute; top: -8px; left: 0; right: 0;
      height: 16px;
      background: repeating-linear-gradient(90deg,
        #86efac 0px, #86efac 20px,
        #4ade80 20px, #4ade80 40px
      );
      border-radius: 50%;
    }

    /* ── Scene container ── */
    .scene {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; gap: 12px;
      padding-bottom: 60px;
    }

    /* ── 404 text ── */
    .err-num {
      font-size: clamp(4rem, 15vw, 9rem);
      font-weight: 900;
      color: #1e3a5f;
      letter-spacing: -0.04em;
      line-height: 1;
      text-shadow: 4px 6px 0 rgba(30,58,95,0.15);
      animation: err-wobble 3s ease-in-out infinite;
    }
    @keyframes err-wobble {
      0%,100% { transform: rotate(-1deg); }
      50%      { transform: rotate(1deg); }
    }

    /* ── Illustration strip — horizontal chase ── */
    .chase-scene {
      width: min(560px, 92vw);
      height: 160px;
      position: relative;
      overflow: hidden;
    }

    /* Generated illustration (cat chasing dog) */
    .chase-img {
      position: absolute;
      bottom: 0;
      width: 500px;
      animation: chase-run 2.8s linear infinite;
      filter: drop-shadow(4px 4px 0 rgba(0,0,0,0.1));
    }
    @keyframes chase-run {
      0%    { left: -30px; }
      100%  { left: 120%; }
    }

    /* dust puffs behind them */
    .dust {
      position: absolute; bottom: 10px;
      width: 40px; height: 20px;
      border-radius: 50%;
      background: rgba(180,130,90,0.25);
      animation: dust-puff 0.5s ease-out infinite;
    }
    .dust:nth-child(2) { animation-delay: 0.17s; left: 10px; }
    .dust:nth-child(3) { animation-delay: 0.34s; left: 25px; }
    @keyframes dust-puff {
      0%   { transform: scale(0) translateY(0); opacity: 0.6; }
      100% { transform: scale(2.5) translateY(-16px); opacity: 0; }
    }

    /* Ground line under chase */
    .chase-ground {
      position: absolute; bottom: 4px; left: 0; right: 0;
      height: 3px; background: #c8a97e; border-radius: 2px;
    }

    /* ── Text ── */
    .headline {
      font-size: 1.4rem; font-weight: 900; color: #1e3a5f;
      text-align: center;
    }
    .sub {
      font-size: 0.95rem; font-weight: 400; color: #64748b;
      text-align: center; max-width: 320px; line-height: 1.6;
    }

    /* ── Button ── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; border-radius: 999px;
      background: #1e3a5f; color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem; font-weight: 700;
      text-decoration: none;
      box-shadow: 0 6px 0 #0f1f33, 0 8px 20px rgba(30,58,95,0.25);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 9px 0 #0f1f33, 0 12px 24px rgba(30,58,95,0.3);
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0f1f33;
    }

    /* ── Fish bone SVG decoration (what the cat dropped) ── */
    .fishbone {
      position: fixed; z-index: 5;
      animation: fall-spin 1.2s ease-in-out infinite alternate;
      font-size: 28px;
    }
    @keyframes fall-spin {
      0%   { transform: rotate(-10deg) translateY(0); }
      100% { transform: rotate(15deg) translateY(8px); }
    }

    /* ── Paw prints on ground ── */
    .paws {
      position: fixed; bottom: 20px;
      display: flex; gap: 22px; z-index: 6;
      animation: paw-appear 0.5s step-start infinite;
    }
    @keyframes paw-appear {
      0%  { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Clouds -->
  <div class="cloud" style="top:8%;width:120px;height:32px;animation-duration:28s;animation-delay:-5s">
    <div style="position:absolute;top:-18px;left:20px;width:50px;height:50px;background:white;border-radius:50%"></div>
    <div style="position:absolute;top:-10px;left:55px;width:35px;height:35px;background:white;border-radius:50%"></div>
  </div>
  <div class="cloud" style="top:14%;width:90px;height:24px;animation-duration:34s;animation-delay:-14s">
    <div style="position:absolute;top:-14px;left:16px;width:38px;height:38px;background:white;border-radius:50%"></div>
  </div>

  <!-- Ground -->
  <div class="ground"></div>

  <!-- Dropped fish emoji -->
  <div class="fishbone" style="right:18%;bottom:90px">🐟</div>

  <!-- Paw prints -->
  <div class="paws" style="left:10%">
    <span style="font-size:20px;opacity:0.4">🐾</span>
    <span style="font-size:18px;opacity:0.3">🐾</span>
    <span style="font-size:22px;opacity:0.5">🐾</span>
  </div>

  <!-- Main scene -->
  <div class="scene">
    <div class="err-num">404</div>

    <div class="chase-scene">
      <!-- AI generated cat-chasing-dog illustration -->
      <img class="chase-img" src="cat_dog_chase.png" alt="Cat being chased by dog">
      <div class="dust"></div>
      <div class="dust"></div>
      <div class="dust"></div>
      <div class="chase-ground"></div>
    </div>

    <h1 class="headline">Uh oh! The page ran away! 😱</h1>
    <p class="sub">Looks like this page got chased off by a dog. It was last seen running at full speed… somewhere out there.</p>

    <a href="javascript:history.back()" class="btn">
      ← Take me back safely
    </a>
  </div>

<script>
  // Make the cat occasionally "stumble" — random pause mid-chase
  const chaseImg = document.querySelector('.chase-img');
  function randomStumble() {
    const delay = Math.random() * 4000 + 3000;
    setTimeout(() => {
      chaseImg.style.animationPlayState = 'paused';
      chaseImg.style.transform = 'rotate(-8deg) scaleX(-1)'; // brief spin/stumble look
      setTimeout(() => {
        chaseImg.style.transform = '';
        chaseImg.style.animationPlayState = 'running';
        randomStumble();
      }, 400);
    }, delay);
  }
  randomStumble();
</script>
</body>
</html>
