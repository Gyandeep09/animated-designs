<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lamp · Pull & Glow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --lamp-color: #f59e0b;
      --glow-rgba: 245,158,11;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #0d0d12;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 0.7s ease;
    }
    body.lamp-on {
      background: radial-gradient(ellipse 70% 50% at 50% 0%,
        rgba(var(--glow-rgba),0.18) 0%, #0d0d12 68%);
    }

    .ceiling-wire {
      width: 3px; height: 55px;
      background: linear-gradient(to bottom, #444, #666);
      border-radius: 2px;
    }

    .scene { position: relative; display: flex; flex-direction: column; align-items: center; }

    /* ── SVG lamp ── */
    .lamp-svg { width: 210px; cursor: pointer; transition: filter 0.6s ease; }
    .lamp-on .lamp-svg { filter: drop-shadow(0 8px 32px rgba(var(--glow-rgba),0.5)); }

    .shade     { fill: #28283a; transition: fill 0.6s; }
    .shade-hi  { fill: #18182a; transition: fill 0.6s; opacity: 0.5; }
    .bulb      { fill: #2a2a3a; transition: fill 0.6s, filter 0.6s; }
    .stem      { fill: #333345; }
    .base      { fill: #222232; }

    .lamp-on .shade    { fill: var(--lamp-color); }
    .lamp-on .shade-hi { fill: #ffffffaa; }
    .lamp-on .bulb     { fill: #fffdf0; filter: drop-shadow(0 0 14px rgba(var(--glow-rgba),0.9)); }

    /* beam */
    .beam {
      width: 0; height: 0;
      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-top: 180px solid transparent;
      margin-top: -2px;
      transition: border-top-color 0.6s;
      pointer-events: none;
    }
    .lamp-on .beam { border-top-color: rgba(var(--glow-rgba),0.10); }

    /* ── Pull cord ── */
    .cord-wrap {
      position: absolute; right: -34px; top: 78px;
      display: flex; flex-direction: column; align-items: center;
      cursor: grab; user-select: none;
    }
    .cord-line {
      width: 2px; height: 58px;
      background: linear-gradient(to bottom, #555, #999);
      border-radius: 1px;
      transition: height 0.12s;
    }
    .cord-wrap.pulling .cord-line { height: 78px; }
    .cord-knob {
      width: 13px; height: 13px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ccc, #666);
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      transition: transform 0.12s;
    }
    .cord-wrap.pulling .cord-knob { transform: translateY(18px); }

    /* burst */
    @keyframes burst {
      0%   { opacity:0.9; transform:translateX(-50%) scale(0.3); }
      70%  { opacity:0.4; transform:translateX(-50%) scale(1.5); }
      100% { opacity:0;   transform:translateX(-50%) scale(2.2); }
    }
    .burst {
      position:absolute; width:56px; height:56px; border-radius:50%;
      background:rgba(var(--glow-rgba),0.7);
      top:128px; left:50%; transform:translateX(-50%) scale(0);
      opacity:0; pointer-events:none;
    }
    .burst.pop { animation: burst 0.45s ease-out forwards; }

    /* ── Controls ── */
    .controls {
      margin-top: 38px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .controls-label {
      color: #444; font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase;
    }
    .swatches { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .sw {
      width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: transform 0.18s, border-color 0.18s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.45);
    }
    .sw:hover { transform: scale(1.25); }
    .sw.active { border-color: #fff; transform: scale(1.25); }

    .custom-row { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
    .custom-row span { color: #444; font-size: 0.72rem; }
    input[type="color"] {
      width: 30px; height: 30px; border: none; background: none;
      cursor: pointer; padding: 0; border-radius: 50%; overflow: hidden;
    }

    .status {
      margin-top: 18px; font-size: 0.68rem;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: #333; transition: color 0.5s;
    }
    .lamp-on .status { color: #777; }

    .hint { margin-top: 28px; color: #2a2a36; font-size: 0.65rem; letter-spacing: 0.1em; }
  </style>
</head>
<body>
  <div class="ceiling-wire"></div>

  <div class="scene" id="scene">
    <div class="burst" id="burst"></div>

    <svg class="lamp-svg" viewBox="0 0 200 210" id="lampSvg">
      <!-- shade -->
      <polygon class="shade" points="22,134 178,134 152,56 48,56"/>
      <polygon class="shade-hi" points="55,128 145,128 134,66 66,66"/>
      <!-- socket -->
      <rect class="stem" x="92" y="48" width="16" height="12" rx="3"/>
      <!-- bulb -->
      <ellipse class="bulb" cx="100" cy="146" rx="13" ry="15"/>
      <!-- stem down -->
      <rect class="stem" x="97" y="160" width="6" height="34" rx="3"/>
      <!-- base -->
      <ellipse class="base" cx="100" cy="196" rx="36" ry="9"/>
    </svg>

    <div class="beam" id="beam"></div>

    <!-- cord -->
    <div class="cord-wrap" id="cord">
      <div class="cord-line"></div>
      <div class="cord-knob"></div>
    </div>
  </div>

  <p class="status" id="statusTxt">OFF — pull the cord</p>

  <div class="controls">
    <span class="controls-label">Glow colour</span>
    <div class="swatches" id="swatches"></div>
    <div class="custom-row">
      <span>Custom →</span>
      <input type="color" id="customColor" value="#f59e0b">
    </div>
  </div>

  <p class="hint">click lamp · pull cord · press space</p>

<script>
  const PALETTE = [
    { name:'Amber',  hex:'#f59e0b' },
    { name:'Sunset', hex:'#fb923c' },
    { name:'Rose',   hex:'#f43f5e' },
    { name:'Violet', hex:'#a78bfa' },
    { name:'Sky',    hex:'#38bdf8' },
    { name:'Mint',   hex:'#34d399' },
    { name:'Gold',   hex:'#fde68a' },
    { name:'Ice',    hex:'#bae6fd' },
  ];

  let on = false;

  const scene     = document.getElementById('scene');
  const lampSvg   = document.getElementById('lampSvg');
  const cord      = document.getElementById('cord');
  const burst     = document.getElementById('burst');
  const statusTxt = document.getElementById('statusTxt');
  const swatches  = document.getElementById('swatches');
  const customClr = document.getElementById('customColor');

  // Build palette
  PALETTE.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'sw' + (i === 0 ? ' active' : '');
    el.style.background = c.hex;
    el.title = c.name;
    el.addEventListener('click', () => pickColor(c.hex, el));
    swatches.appendChild(el);
  });

  function hexToRgb(hex) {
    return [
      parseInt(hex.slice(1,3),16),
      parseInt(hex.slice(3,5),16),
      parseInt(hex.slice(5,7),16)
    ].join(',');
  }

  function pickColor(hex, el) {
    customClr.value = hex;
    document.querySelectorAll('.sw').forEach(s => s.classList.remove('active'));
    if (el) el.classList.add('active');
    document.documentElement.style.setProperty('--lamp-color', hex);
    document.documentElement.style.setProperty('--glow-rgba', hexToRgb(hex));
  }

  customClr.addEventListener('input', e => {
    document.querySelectorAll('.sw').forEach(s => s.classList.remove('active'));
    document.documentElement.style.setProperty('--lamp-color', e.target.value);
    document.documentElement.style.setProperty('--glow-rgba', hexToRgb(e.target.value));
  });

  function toggle() {
    on = !on;
    document.body.classList.toggle('lamp-on', on);
    scene.classList.toggle('lamp-on', on);
    statusTxt.textContent = on ? 'ON — glowing' : 'OFF — pull the cord';
    burst.classList.remove('pop');
    void burst.offsetWidth;
    burst.classList.add('pop');
  }

  // Pull cord animation + toggle
  cord.addEventListener('mousedown', () => cord.classList.add('pulling'));
  cord.addEventListener('mouseup',   () => { cord.classList.remove('pulling'); toggle(); });
  cord.addEventListener('mouseleave',() => cord.classList.remove('pulling'));

  // Click lamp shade
  lampSvg.addEventListener('click', toggle);

  // Spacebar
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
  });
</script>
</body>
</html>
