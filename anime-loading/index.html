<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading…</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080612;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:system-ui}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;transition:opacity 1s;gap:24px}
.overlay.gone{opacity:0;pointer-events:none}

/* Orbit rings */
.orbit-ring{position:absolute;border:1px solid rgba(139,92,246,.12);border-radius:50%;pointer-events:none}
.orbit-ring:nth-child(1){width:420px;height:420px;animation:spin 20s linear infinite}
.orbit-ring:nth-child(2){width:540px;height:540px;animation:spin 28s linear infinite reverse}
.orbit-ring:nth-child(3){width:640px;height:640px;animation:spin 35s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit-dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#818cf8;box-shadow:0 0 12px #818cf8}
.orbit-ring:nth-child(1) .orbit-dot{top:0;left:50%;transform:translate(-50%,-50%)}
.orbit-ring:nth-child(2) .orbit-dot{bottom:0;left:50%;transform:translate(-50%,50%);background:#c084fc;box-shadow:0 0 12px #c084fc}
.orbit-ring:nth-child(3) .orbit-dot{top:50%;right:0;transform:translate(50%,-50%);background:#38bdf8;box-shadow:0 0 12px #38bdf8}

/* Grid floor */
.grid-floor{position:fixed;bottom:0;left:0;right:0;height:35vh;
  background:linear-gradient(0deg,rgba(99,102,241,.06) 1px,transparent 1px),
  linear-gradient(90deg,rgba(99,102,241,.06) 1px,transparent 1px);
  background-size:40px 40px;
  transform:perspective(400px) rotateX(55deg);transform-origin:bottom;opacity:.5}

/* Scan line */
.scan{position:fixed;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(139,92,246,.4),transparent);animation:scanmove 3.5s linear infinite;z-index:1}
@keyframes scanmove{from{top:-2px}to{top:100%}}

/* Progress */
.prog-wrap{width:240px;position:relative}
.prog-track{height:4px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.prog-bar{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#818cf8,#c084fc,#38bdf8)}
.prog-label{text-align:center;margin-top:10px;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:#555}

/* Particles */
.particle{position:fixed;border-radius:50%;pointer-events:none;opacity:0}
@keyframes pfloat{0%{opacity:0;transform:translateY(0) scale(.3)}15%{opacity:.6}85%{opacity:.15}100%{opacity:0;transform:translateY(-100vh) scale(.8)}}

/* Page content */
.page{height:100vh;display:flex;align-items:center;justify-content:center;color:#333;font-size:1rem}
</style>
</head>
<body>
<div class="grid-floor"></div>
<div class="scan"></div>

<div class="overlay" id="loader">
  <!-- Orbit rings -->
  <div class="orbit-ring"><div class="orbit-dot"></div></div>
  <div class="orbit-ring"><div class="orbit-dot"></div></div>
  <div class="orbit-ring"><div class="orbit-dot"></div></div>

  <!-- CHARACTER -->
  <svg id="char" width="280" height="380" viewBox="0 0 280 380" style="overflow:visible">
    <defs>
      <radialGradient id="glow1"><stop offset="0%" stop-color="#a78bfa" stop-opacity=".3"/><stop offset="100%" stop-color="transparent"/></radialGradient>
      <linearGradient id="hair-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6d28d9"/><stop offset="100%" stop-color="#3b0764"/></linearGradient>
      <linearGradient id="skin-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fde4cc"/><stop offset="100%" stop-color="#f5c8a0"/></linearGradient>
      <linearGradient id="hoodie-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="50%" stop-color="#6d28d9"/><stop offset="100%" stop-color="#4c1d95"/></linearGradient>
      <linearGradient id="skirt-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f0a2a"/></linearGradient>
      <filter id="shadow1"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".25"/></filter>
    </defs>

    <!-- Floor glow -->
    <ellipse cx="140" cy="370" rx="80" ry="14" fill="url(#glow1)" id="floorGlow"/>

    <!-- ── LEGS ── -->
    <g id="legL">
      <path d="M108,295 Q106,325 104,350 Q103,362 110,365 L126,365 Q130,362 128,350 Q126,325 124,295Z" fill="url(#skin-g)"/>
      <path d="M104,350 Q103,368 112,370 L128,370 Q134,368 130,358 Q128,350 126,348Z" fill="#1e1b4b"/>
    </g>
    <g id="legR">
      <path d="M156,295 Q154,325 152,350 Q151,362 158,365 L174,365 Q178,362 176,350 Q174,325 172,295Z" fill="url(#skin-g)"/>
      <path d="M152,350 Q151,368 160,370 L176,370 Q182,368 178,358 Q176,350 174,348Z" fill="#1e1b4b"/>
    </g>

    <!-- ── BODY ── -->
    <g id="bodyG">
      <!-- Skirt -->
      <path id="skirt" d="M90,260 Q88,280 82,300 L198,300 Q192,280 190,260Z" fill="url(#skirt-g)"/>
      <!-- Hoodie body -->
      <path d="M92,180 Q80,200 86,260 L194,260 Q200,200 188,180 Q170,168 140,166 Q110,168 92,180Z" fill="url(#hoodie-g)" filter="url(#shadow1)"/>
      <!-- Hoodie pocket -->
      <rect x="112" y="225" width="56" height="28" rx="10" fill="#5b21b6" opacity=".6"/>
      <!-- Zip line -->
      <line x1="140" y1="180" x2="140" y2="258" stroke="#4c1d95" stroke-width="2" opacity=".5"/>
      <!-- Collar -->
      <path d="M115,180 Q140,192 165,180" fill="none" stroke="#5b21b6" stroke-width="3"/>
    </g>

    <!-- ── ARMS ── -->
    <!-- Left arm (crossed position, will animate) -->
    <g id="armL">
      <path d="M92,188 Q68,200 58,228 Q54,240 62,244 Q72,248 78,236 Q88,212 96,198Z" fill="url(#hoodie-g)"/>
      <ellipse cx="62" cy="246" rx="12" ry="10" fill="url(#skin-g)"/>
    </g>
    <!-- Right arm -->
    <g id="armR">
      <path d="M188,188 Q212,200 222,228 Q226,240 218,244 Q208,248 202,236 Q192,212 184,198Z" fill="url(#hoodie-g)"/>
      <ellipse cx="218" cy="246" rx="12" ry="10" fill="url(#skin-g)"/>
    </g>

    <!-- ── NECK ── -->
    <rect x="130" y="152" width="20" height="28" rx="8" fill="url(#skin-g)"/>

    <!-- ── HEAD ── -->
    <g id="headG">
      <!-- Back hair mass -->
      <ellipse cx="140" cy="100" rx="62" ry="68" fill="url(#hair-g)"/>
      <!-- Side hair left -->
      <path id="hairL" d="M78,100 Q65,120 68,155 Q70,168 80,165 Q85,158 82,140 Q80,120 82,100Z" fill="url(#hair-g)"/>
      <!-- Side hair right -->
      <path id="hairR" d="M202,100 Q215,120 212,155 Q210,168 200,165 Q195,158 198,140 Q200,120 198,100Z" fill="url(#hair-g)"/>

      <!-- Face -->
      <ellipse cx="140" cy="108" rx="52" ry="56" fill="url(#skin-g)"/>

      <!-- Bangs -->
      <path d="M88,94 Q92,52 140,44 Q188,52 192,94 Q175,72 158,80 Q140,62 122,80 Q105,72 88,94Z" fill="url(#hair-g)"/>
      <!-- Hair highlight -->
      <path d="M110,60 Q130,50 150,60" stroke="rgba(255,255,255,.15)" stroke-width="3" fill="none"/>

      <!-- Ears -->
      <ellipse cx="88" cy="112" rx="10" ry="14" fill="#f5c8a0"/>
      <ellipse cx="88" cy="112" rx="6" ry="9" fill="#f0b898"/>
      <ellipse cx="192" cy="112" rx="10" ry="14" fill="#f5c8a0"/>
      <ellipse cx="192" cy="112" rx="6" ry="9" fill="#f0b898"/>

      <!-- ── EYES ── -->
      <g id="eyesG">
        <!-- Left eye -->
        <ellipse cx="118" cy="110" rx="16" ry="18" fill="white"/>
        <ellipse cx="118" cy="113" rx="12" ry="14" fill="#7c3aed"/>
        <ellipse cx="118" cy="114" rx="7" ry="9" fill="#1e0a3a"/>
        <ellipse cx="114" cy="106" rx="4" ry="4" fill="white"/>
        <ellipse cx="123" cy="118" rx="2" ry="2" fill="rgba(255,255,255,.6)"/>
        <path d="M102,102 Q118,92 134,102" stroke="#1e0a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- Eyelid -->
        <ellipse id="lidL" cx="118" cy="102" rx="16" ry="18" fill="url(#skin-g)" opacity="0"/>

        <!-- Right eye -->
        <ellipse cx="162" cy="110" rx="16" ry="18" fill="white"/>
        <ellipse cx="162" cy="113" rx="12" ry="14" fill="#7c3aed"/>
        <ellipse cx="162" cy="114" rx="7" ry="9" fill="#1e0a3a"/>
        <ellipse cx="158" cy="106" rx="4" ry="4" fill="white"/>
        <ellipse cx="167" cy="118" rx="2" ry="2" fill="rgba(255,255,255,.6)"/>
        <path d="M146,102 Q162,92 178,102" stroke="#1e0a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <ellipse id="lidR" cx="162" cy="102" rx="16" ry="18" fill="url(#skin-g)" opacity="0"/>
      </g>

      <!-- Nose -->
      <ellipse cx="140" cy="128" rx="4" ry="3" fill="#e8a882"/>

      <!-- Mouth -->
      <g id="mouthG">
        <path id="mouthPath" d="M126,138 Q140,146 154,138" stroke="#c06060" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Blush -->
      <ellipse id="blushL" cx="104" cy="130" rx="14" ry="8" fill="#ffaac8" opacity=".45"/>
      <ellipse id="blushR" cx="176" cy="130" rx="14" ry="8" fill="#ffaac8" opacity=".45"/>

      <!-- Steam puff (hidden, animated in) -->
      <g id="steamG" opacity="0">
        <circle cx="200" cy="80" r="8" fill="rgba(200,200,255,.5)"/>
        <circle cx="212" cy="65" r="12" fill="rgba(200,200,255,.4)"/>
        <circle cx="226" cy="48" r="16" fill="rgba(200,200,255,.25)"/>
      </g>

      <!-- Holographic watch (on left wrist area, hidden initially) -->
      <g id="watchG" opacity="0" transform="translate(40,240)">
        <ellipse cx="0" cy="0" rx="22" ry="22" fill="rgba(99,102,241,.15)" stroke="#818cf8" stroke-width="1"/>
        <text x="-12" y="4" font-size="10" fill="#a5b4fc" font-family="monospace">03:42</text>
        <circle cx="0" cy="0" r="22" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 4">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- Vibration lines (impatience indicator) -->
    <g id="vibeLines" opacity="0">
      <line x1="60" y1="160" x2="50" y2="155" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
      <line x1="58" y1="172" x2="46" y2="170" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
      <line x1="220" y1="160" x2="230" y2="155" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
      <line x1="222" y1="172" x2="234" y2="170" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
    </g>
  </svg>

  <!-- Progress -->
  <div class="prog-wrap">
    <div class="prog-track"><div class="prog-bar" id="progBar"></div></div>
    <div class="prog-label" id="progLabel">Initializing systems…</div>
  </div>
</div>

<div class="page">Content loaded ✦</div>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// Particles
for(let i=0;i<30;i++){
  const p=document.createElement('div');p.className='particle';
  const sz=Math.random()*3+1.5;
  const clrs=['#818cf8','#c084fc','#38bdf8','#a78bfa'];
  p.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}vw;bottom:-10px;background:${clrs[~~(Math.random()*4)]};animation:pfloat ${6+Math.random()*8}s linear ${Math.random()*6}s infinite`;
  document.body.appendChild(p);
}

// ── GSAP MASTER TIMELINE ──
gsap.defaults({ease:'power2.inOut'});

// Breathing
gsap.to('#bodyG',{scaleY:1.015,transformOrigin:'50% 100%',duration:1.6,yoyo:true,repeat:-1,ease:'sine.inOut'});

// Hair float
gsap.to('#hairL',{rotate:3,transformOrigin:'50% 0%',duration:2.4,yoyo:true,repeat:-1,ease:'sine.inOut'});
gsap.to('#hairR',{rotate:-3,transformOrigin:'50% 0%',duration:2.4,yoyo:true,repeat:-1,ease:'sine.inOut',delay:.3});

// Blush pulse
gsap.to('#blushL,#blushR',{opacity:.7,duration:1.8,yoyo:true,repeat:-1,ease:'sine.inOut'});

// Floor glow pulse
gsap.to('#floorGlow',{opacity:.6,scaleX:1.1,transformOrigin:'50% 50%',duration:2,yoyo:true,repeat:-1,ease:'sine.inOut'});

// ── BLINK ──
function blink(){
  const tl=gsap.timeline();
  tl.to('#lidL,#lidR',{opacity:1,duration:.08})
    .to('#lidL,#lidR',{opacity:0,duration:.08},'+=.06')
    .then(()=>gsap.delayedCall(.1+Math.random()*3,blink));
}
blink();

// ── PHASE A: IMPATIENT FOOT TAP ──
const footTap=gsap.timeline({repeat:-1});
footTap.to('#legR',{rotate:-12,transformOrigin:'160px 295px',duration:.15,ease:'power3.out'})
  .to('#legR',{rotate:0,duration:.12,ease:'bounce.out'})
  .to('#legR',{rotate:0,duration:.4});

// Vibration lines flicker with foot tap
gsap.to('#vibeLines',{opacity:.6,duration:.1,yoyo:true,repeat:-1,repeatDelay:.4});

// Body micro-shake (impatience)
const shake=gsap.timeline({repeat:-1,repeatDelay:2});
shake.to('#char',{x:2,duration:.04}).to('#char',{x:-2,duration:.04}).to('#char',{x:1.5,duration:.04}).to('#char',{x:-1,duration:.04}).to('#char',{x:0,duration:.06});

// ── PHASE B: CHECK WATCH + HUFF (every 4s) ──
function checkWatch(){
  const tl=gsap.timeline({onComplete:()=>gsap.delayedCall(3+Math.random()*2,checkWatch)});

  // Arm raises to look at watch
  tl.to('#armL',{rotate:-50,transformOrigin:'92px 188px',duration:.5,ease:'back.out(1.5)'})
    .to('#watchG',{opacity:1,duration:.3},'-=.2')
    .to('#headG',{rotate:-8,transformOrigin:'140px 140px',duration:.35,ease:'power2.out'},'-=.2')
    // Hold + look
    .to({},{duration:.8})
    // Huff — mouth opens
    .to('#mouthPath',{attr:{d:'M126,136 Q140,150 154,136'},duration:.15},'huff')
    // Steam puff shoots out
    .to('#steamG',{opacity:1,y:-10,duration:.3,ease:'power2.out'},'huff')
    .to('#steamG circle:nth-child(1)',{scale:1.3,transformOrigin:'50% 50%',duration:.4},'huff')
    .to('#steamG circle:nth-child(2)',{scale:1.4,y:-8,transformOrigin:'50% 50%',duration:.5},'huff+=.1')
    .to('#steamG circle:nth-child(3)',{scale:1.5,y:-12,transformOrigin:'50% 50%',duration:.6},'huff+=.15')
    // Hair poof
    .to('#hairL,#hairR',{scaleX:1.15,scaleY:1.08,transformOrigin:'50% 100%',duration:.2,ease:'back.out(3)'},'huff')
    // Hold
    .to({},{duration:.5})
    // Reset everything
    .to('#armL',{rotate:0,duration:.4,ease:'power2.inOut'})
    .to('#watchG',{opacity:0,duration:.2},'-=.3')
    .to('#headG',{rotate:0,duration:.3},'-=.2')
    .to('#mouthPath',{attr:{d:'M126,138 Q140,146 154,138'},duration:.2},'-=.2')
    .to('#steamG',{opacity:0,y:0,duration:.3},'-=.2')
    .to('#steamG circle',{scale:1,y:0,duration:.01})
    .to('#hairL,#hairR',{scaleX:1,scaleY:1,duration:.3,ease:'power2.inOut'},'-=.3');
}
gsap.delayedCall(2,checkWatch);

// ── PROGRESS BAR ──
const labels=['Initializing systems…','Compiling shaders…','Loading assets…','Calibrating…','Almost there…','Finalizing…'];
let li=0;
gsap.to('#progBar',{width:'100%',duration:8,ease:'power1.inOut'});
const labelLoop=setInterval(()=>{
  li=(li+1)%labels.length;
  gsap.to('#progLabel',{opacity:0,duration:.2,onComplete:()=>{
    $('#progLabel').textContent=labels[li];
    gsap.to('#progLabel',{opacity:1,duration:.2});
  }});
},1800);

// Dismiss
setTimeout(()=>{
  clearInterval(labelLoop);
  gsap.to('.overlay',{opacity:0,duration:.8,onComplete:()=>$('.overlay').style.display='none'});
},8500);
</script>
</body>
</html>
