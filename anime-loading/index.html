<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Loader</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #05050a;
      font-family: 'Inter', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* ── Overlay ── */
    .loader-overlay {
      position: fixed; inset: 0;
      background: #05050a;
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    .loader-overlay.hidden { opacity: 0; visibility: hidden; }

    /* ── Card ── */
    .loader-card {
      display: flex; flex-direction: column; align-items: center; gap: 32px;
    }

    /* ── Sakura / slash mark animation ── */
    .anime-mark {
      position: relative; width: 80px; height: 80px;
    }

    /* outer ring */
    @keyframes ring-spin {
      to { transform: rotate(360deg); }
    }
    .ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #e879f9;
      border-right-color: #818cf8;
      animation: ring-spin 1.1s linear infinite;
    }
    .ring-2 {
      inset: 8px;
      border-top-color: transparent;
      border-bottom-color: #38bdf8;
      border-left-color: #34d399;
      animation: ring-spin 1.6s linear infinite reverse;
    }

    /* center kanji pulse */
    @keyframes kanji-pulse {
      0%,100% { opacity: 0.4; transform: translate(-50%,-50%) scale(0.9); }
      50%      { opacity: 1;   transform: translate(-50%,-50%) scale(1.1); }
    }
    .kanji {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 22px; font-weight: 300;
      background: linear-gradient(135deg, #e879f9, #818cf8, #38bdf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: kanji-pulse 1.6s ease-in-out infinite;
    }

    /* ── Progress bar ── */
    .progress-wrap {
      width: 200px; height: 2px; background: #1a1a2e;
      border-radius: 2px; overflow: hidden;
    }
    @keyframes progress-fill {
      0%   { width: 0%; }
      80%  { width: 85%; }
      100% { width: 100%; }
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #e879f9, #818cf8, #38bdf8);
      border-radius: 2px;
      animation: progress-fill 3s cubic-bezier(0.4,0,0.2,1) forwards;
    }

    /* ── Dots ── */
    @keyframes dot-bounce {
      0%,80%,100% { transform: translateY(0); opacity: 0.3; }
      40%          { transform: translateY(-8px); opacity: 1; }
    }
    .dots { display: flex; gap: 6px; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #818cf8;
      animation: dot-bounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; background: #e879f9; }
    .dot:nth-child(3) { animation-delay: 0.4s; background: #38bdf8; }

    /* ── Text ── */
    .loader-title {
      font-size: 0.7rem; letter-spacing: 0.22em;
      text-transform: uppercase; color: #333;
    }
    @keyframes blink {
      0%,100% { opacity: 0.3; }
      50%      { opacity: 1; }
    }
    .loader-sub {
      font-size: 0.62rem; letter-spacing: 0.14em;
      color: #2a2a40;
      animation: blink 2s ease-in-out infinite;
    }

    /* ── Background particles ── */
    @keyframes float-up {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.2; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
    .particle {
      position: fixed; border-radius: 50%;
      pointer-events: none;
      animation: float-up linear infinite;
    }

    /* ── Page content (shows after load) ── */
    .page-content {
      display: flex; align-items: center; justify-content: center;
      height: 100vh;
      font-size: 1.1rem; color: #444; letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

  <!-- Loader -->
  <div class="loader-overlay" id="loader">
    <div class="loader-card">

      <div class="anime-mark">
        <div class="ring"></div>
        <div class="ring ring-2"></div>
        <div class="kanji">読</div>
      </div>

      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar"></div>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <span class="loader-title">Loading</span>
        <span class="loader-sub">Please wait…</span>
      </div>

    </div>
  </div>

  <!-- Page -->
  <div class="page-content">Content loaded ✦</div>

<script>
  // Floating particles
  const colors = ['#e879f9','#818cf8','#38bdf8','#34d399'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 4 + 2;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}vw;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${Math.random()*6+5}s;
      animation-delay:${Math.random()*4}s;
      opacity:0;
    `;
    document.body.appendChild(p);
  }

  // Dismiss loader on page load (+ minimum 2.8s)
  const loader = document.getElementById('loader');
  let ready = false, elapsed = false;

  window.addEventListener('load', () => { ready = true; tryHide(); });
  setTimeout(() => { elapsed = true; tryHide(); }, 2800);

  function tryHide() {
    if (ready && elapsed) {
      loader.classList.add('hidden');
    }
  }
</script>
</body>
</html>
