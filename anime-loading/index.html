<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0a1a;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    /* ── Stars BG ── */
    .stars { position: fixed; inset: 0; pointer-events: none; }
    .star {
      position: absolute; border-radius: 50%;
      background: #fff; opacity: 0;
      animation: twinkle var(--d, 3s) ease-in-out var(--delay, 0s) infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: 0; transform: scale(0.6); }
      50%      { opacity: var(--op, 0.6); transform: scale(1); }
    }

    /* ── Full overlay ── */
    .loader-overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0;
      z-index: 100;
      transition: opacity 0.9s ease, visibility 0.9s;
    }
    .loader-overlay.hidden { opacity: 0; visibility: hidden; }

    /* ── Ground / scene ── */
    .scene {
      position: relative;
      display: flex; flex-direction: column;
      align-items: center;
    }

    /* ── Glow blob under character ── */
    .glow-blob {
      position: absolute;
      bottom: -10px;
      width: 160px; height: 40px;
      background: radial-gradient(ellipse, rgba(232,121,249,0.3), transparent 70%);
      border-radius: 50%;
      filter: blur(12px);
      animation: blob-pulse 2s ease-in-out infinite;
    }
    @keyframes blob-pulse {
      0%,100% { transform: scaleX(1); opacity: 0.6; }
      50%      { transform: scaleX(1.15); opacity: 1; }
    }

    /* ── Character image ── */
    .char-wrap {
      position: relative;
      width: 220px;
      animation: float 3.2s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0px) rotate(-0.5deg); }
      30%      { transform: translateY(-12px) rotate(0.5deg); }
      60%      { transform: translateY(-6px) rotate(-0.3deg); }
    }

    .char-img {
      width: 100%;
      filter: drop-shadow(0 8px 24px rgba(232,121,249,0.4));
    }

    /* Sleep Z's floating from character */
    .zzz {
      position: absolute;
      top: 10px; right: 0px;
      font-size: 18px;
      font-weight: 700;
      color: #e879f9;
      opacity: 0;
      animation: zzz-float 3s ease-in-out infinite;
    }
    .zzz:nth-child(2) { font-size: 13px; top: 28px; right: -16px; animation-delay: 0.8s; }
    .zzz:nth-child(3) { font-size: 9px;  top: 44px; right: -28px; animation-delay: 1.6s; }
    @keyframes zzz-float {
      0%   { opacity: 0; transform: translate(0,0) rotate(-5deg); }
      20%  { opacity: 0.9; }
      100% { opacity: 0; transform: translate(12px,-28px) rotate(10deg); }
    }

    /* ── Speech bubble ── */
    .bubble {
      position: absolute;
      top: -52px; left: 50%;
      transform: translateX(-10%);
      background: white;
      border-radius: 16px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      color: #333;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      animation: bubble-appear 0.4s ease forwards, bubble-bob 2.5s ease-in-out 0.5s infinite;
      opacity: 0;
    }
    .bubble::after {
      content: '';
      position: absolute;
      bottom: -8px; left: 20px;
      border: 8px solid transparent;
      border-top-color: white;
      border-bottom: none;
    }
    @keyframes bubble-appear {
      to { opacity: 1; }
    }
    @keyframes bubble-bob {
      0%,100% { transform: translateX(-10%) translateY(0); }
      50%      { transform: translateX(-10%) translateY(-4px); }
    }

    /* ── Progress bar section ── */
    .progress-section {
      margin-top: 24px;
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      width: 260px;
    }

    .progress-track {
      width: 100%; height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 6px; overflow: hidden;
      position: relative;
    }
    @keyframes progress-run {
      0%   { width: 0%; }
      20%  { width: 18%; }
      40%  { width: 35%; }
      55%  { width: 55%; }
      70%  { width: 68%; }
      85%  { width: 82%; }
      100% { width: 100%; }
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #818cf8, #e879f9, #38bdf8);
      border-radius: 6px;
      animation: progress-run 3s cubic-bezier(0.4,0,0.2,1) forwards;
    }
    /* shimmer */
    .progress-fill::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.35) 50%, transparent 100%);
      animation: shimmer 1.2s linear infinite;
    }
    @keyframes shimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }

    /* dots */
    .dots { display: flex; gap: 6px; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      animation: dot-hop 1.4s ease-in-out infinite;
    }
    .dot:nth-child(1) { background: #818cf8; }
    .dot:nth-child(2) { background: #e879f9; animation-delay: 0.2s; }
    .dot:nth-child(3) { background: #38bdf8; animation-delay: 0.4s; }
    @keyframes dot-hop {
      0%,80%,100% { transform: translateY(0); }
      40%          { transform: translateY(-7px); }
    }

    .load-text {
      font-size: 0.7rem; letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #444;
    }

    /* page content */
    .page-content {
      height: 100vh; display: flex;
      align-items: center; justify-content: center;
      color: #555; font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 1.1rem; letter-spacing: 0.06em;
    }
  </style>
</head>
<body>

  <!-- Starfield -->
  <div class="stars" id="stars"></div>

  <!-- Loader -->
  <div class="loader-overlay" id="loader">
    <div class="scene">
      <div class="glow-blob"></div>

      <div class="char-wrap">
        <!-- Speech bubble -->
        <div class="bubble" id="bubble">もうちょっと待って… 😪</div>

        <!-- Z Z Z -->
        <span class="zzz">Z</span>
        <span class="zzz">z</span>
        <span class="zzz">z</span>

        <!-- AI Generated Character -->
        <img class="char-img" src="anime_girl.png" alt="Loading character">
      </div>

      <div class="progress-section">
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
        <div class="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <span class="load-text">Loading...</span>
      </div>
    </div>
  </div>

  <!-- Page content -->
  <div class="page-content">Content is ready ✦</div>

<script>
  // Stars
  const starContainer = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 1;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}vw;
      top:${Math.random()*100}vh;
      --d:${(Math.random()*3+2).toFixed(1)}s;
      --delay:${(Math.random()*5).toFixed(1)}s;
      --op:${(Math.random()*0.5+0.2).toFixed(2)};
    `;
    starContainer.appendChild(s);
  }

  // Cycle speech bubble messages
  const messages = [
    'もうちょっと待って… 😪',
    'Almost there~ 💤',
    'Still loading… 🌙',
    'One sec, okay? 🍡',
    'Getting sleepy… 😴',
  ];
  const bubble = document.getElementById('bubble');
  let msgIdx = 0;
  setInterval(() => {
    msgIdx = (msgIdx + 1) % messages.length;
    bubble.style.opacity = '0';
    bubble.style.transition = 'opacity 0.3s';
    setTimeout(() => {
      bubble.textContent = messages[msgIdx];
      bubble.style.opacity = '1';
    }, 300);
  }, 2200);

  // Hide loader
  const loader = document.getElementById('loader');
  let pageReady = false, minDone = false;
  window.addEventListener('load', () => { pageReady = true; tryHide(); });
  setTimeout(() => { minDone = true; tryHide(); }, 3200);
  function tryHide() {
    if (pageReady && minDone) loader.classList.add('hidden');
  }
</script>
</body>
</html>
